<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Mes Tâches</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="axios.min.js"></script>


</head>
<body>
    <div class="container">
        <nav>
            <a href="dash.html">Tableau de bord</a>
        </nav>

        <header>
            <h1 style="margin-bottom: 30px;">Liste des tâches</h1>
        </header>

        <div class="card controls">
            <input type="text" id="search-input" class="input-field" placeholder="Chercher une tâche (titre ou description)...">
            
            <select id="filter-status" class="input-field" style="max-width: 200px;">
                <option value="">Tous les statuts</option>
                <option value="à faire">À faire</option>
                <option value="en cours">En cours</option>
                <option value="terminé">Terminé</option>
            </select>

            <button onclick="fetchTasks(1)" class="btn-brand">Filtrer</button>
        </div>

        <div class="card">
            <div id="tasks-container">
                </div>
            
            <div id="pagination" style="display:flex; justify-content:center; gap:8px; margin-top:20px;">
            </div>
        </div>
    </div>

    <script src="filtrage.js"></script>
</body>
</html>
