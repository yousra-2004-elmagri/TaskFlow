<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- CORRECTION : URL Axios complète et valide -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js pour le graphique d'activité -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Styles internes spécifiques au Dashboard -->
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .dashboard, .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .stat-label { margin: 0 0 5px 0; color: #666; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #333; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="dash.html" class="active">Tableau de bord</a>
            <a href="filtrage.html">Mes Tâches</a>
        </nav>

        <header>
            <h1 style="margin-bottom: 30px;">Aperçu de l'activité</h1>
        </header>

        <div class="grid-stats">
            <div class="card">
                <div class="stat-item">
                    <p class="stat-label">Projets Actifs</p>
                    <h3 id="stat-projects" class="stat-value">0</h3>
                </div>
            </div>
            <div class="card">
                <div class="stat-item">
                    <p class="stat-label">Tâches Assignées</p>
                    <h3 id="stat-assigned" class="stat-value">0</h3>
                </div>
            </div>
            <div class="card">
                <div class="stat-item">
                    <p class="stat-label">Terminées</p>
                    <h3 id="stat-completed" class="stat-value" style="color: #05CD99;">0</h3>
                </div>
            </div>
            <div class="card">
                <div class="stat-item">
                    <p class="stat-label">En Retard</p>
                    <h3 id="stat-late" class="stat-value" style="color: #EE5D50;">0</h3>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 20px; margin-bottom: 20px;">Priorités du moment</h2>
            <div id="priority-container">
                <!-- Les tâches seront injectées ici par le JavaScript -->
            </div>
        </div>

        <!-- CORRECTION : Le bloc graphique est maintenant correctement à l'intérieur du container -->
        <div class="card" style="margin-top: 20px; min-height: 280px;">
            <h2 style="font-size: 20px; margin-bottom: 20px;">Statistiques de productivité (Cette semaine)</h2>
            <div style="position: relative; height: 200px; width: 100%;">
                <canvas id="activityChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div> <!-- CORRECTION : Fermeture unique et correcte de la div .container -->

    <script src="dashboard.js"></script>
</body>
</html>
